name: Agent and bundled extension
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Verify exact bundled extension bytes
        run: python3 scripts/verify-bundled-extension.py --self-test
      - name: Verify CI dependency fallback
        env:
          CSWEET_RUN_DEPENDENCY_INTEGRATION: '1'
        run: python3 scripts/test-ci-dependencies.py
      - name: Prepare pinned C-Sweet dependencies
        env:
          CSWEET_DEPENDENCY_TOKEN: ${{ secrets.CSWEET_DEPENDENCY_READ_TOKEN }}
        run: python3 scripts/prepare-ci-dependencies.py
      - name: Pack the companion harness when verifying an unpublished SDK
        shell: pwsh
        run: |
          $proofPath = '.artifacts/ci-dependencies/resolved.json'
          $proof = Get-Content -Raw $proofPath | ConvertFrom-Json
          [xml]$tests = Get-Content -Raw 'tests/CSweet.Agent.Director.VideoGame.Tests/CSweet.Agent.Director.VideoGame.Tests.csproj'
          $version = ($tests.Project.ItemGroup.PackageReference | Where-Object Include -eq 'CSweet.Agent.Testing').Version
          $sdk = @($proof.packages | Where-Object { $_.package -eq 'CSweet.Agent.SDK' -and $_.version -eq $version })
          if ($sdk.Count -ne 1) { throw "Expected the SDK matching the test package at $version." }
          if ($sdk[0].origin -eq 'nuget.org') { return }

          $root = Join-Path $env:RUNNER_TEMP 'csweet-ci-dependencies/source'
          $sources = @(Get-ChildItem $root -Directory -Filter "CSweet.Agent.SDK-$version-*" |
            Where-Object { (git -C $_.FullName rev-parse HEAD) -eq $sdk[0].commit })
          if ($sources.Count -ne 1) { throw 'Expected one checkout at the verified SDK commit.' }
          $project = Join-Path $sources[0].FullName 'src/CSweet.Agent.Testing/CSweet.Agent.Testing.csproj'
          dotnet pack $project -c Release -o $env:RestoreAdditionalProjectSources -p:UseLocalCSweetWorkManagementContracts=false
          if ($LASTEXITCODE -ne 0) { throw 'Packing the pinned test harness failed.' }

          $package = Join-Path $env:RestoreAdditionalProjectSources "CSweet.Agent.Testing.$version.nupkg"
          $proof.packages += [ordered]@{ package = 'CSweet.Agent.Testing'; version = $version; origin = 'source'
            commit = $sdk[0].commit; repository = $sdk[0].repository; sha256 = (Get-FileHash $package).Hash.ToLowerInvariant() }
          $proof | ConvertTo-Json -Depth 8 | Set-Content $proofPath
      - name: Verify bundled extension provenance
        shell: pwsh
        run: |
          $root = 'extensions/video-game'
          $manifest = Get-Content "$root/extension.json" -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files.PSObject.Properties) {
            if ((Get-FileHash "$root/$($file.Name)" -Algorithm SHA256).Hash.ToLowerInvariant() -ne $file.Value) {
              throw "Extension hash mismatch: $($file.Name)"
            }
          }
      - name: Test using pinned package dependencies
        env:
          NUGET_PACKAGES: ${{ runner.temp }}/clean-packages
        shell: pwsh
        run: |
          $manifest = Get-Content csweet-plugin.json -Raw | ConvertFrom-Json
          dotnet test -c Release -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetMemory=false -p:RestoreSources=https://api.nuget.org/v3/index.json
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed.' }
          dotnet run --project $manifest.runtime.projectPath -c Release --no-build -- --self-test
          if ($LASTEXITCODE -ne 0) { throw 'Self-test failed.' }
          dotnet pack $manifest.runtime.projectPath -c Release --no-build --no-restore -o .artifacts/packages -p:UseLocalCSweetAgentSdk=false -p:UseLocalCSweetMemory=false
          if ($LASTEXITCODE -ne 0) { throw 'Pack failed.' }
      - uses: actions/upload-artifact@v4
        with:
          name: agent-packages
          path: .artifacts/packages/*.nupkg
          if-no-files-found: error
      - name: Upload dependency provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.job }}-ci-dependencies
          path: .artifacts/ci-dependencies/resolved.json
          if-no-files-found: ignore
